services:
  postgres:
    image: postgres:17-alpine
    container_name: atc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: atc_user
      POSTGRES_PASSWORD: atc_password
      POSTGRES_DB: atc_quiz
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atc_user -d atc_quiz"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: