server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Quiz content is small; keep request bodies bounded.
  client_max_body_size 2m;

  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # The API trusts exactly this one proxy hop (TRUST_PROXY=true) for per-client login limits.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Vite puts a content hash in every asset name, so these can be cached forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Single-page app: unknown paths get index.html; never cache it so new deploys load.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
